<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ortodromia e lossodromie</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root{
    --bg:#ffffff;
    --testo:#0f172a;
    --muto:#64748b;
    --bordo:#e2e8f0;
    --campo:#f1f5f9;
    --ortodromia:#2563eb; /* blu geodetica */
    --lossodromia:#ea580c;/* arancio rotte a angolo costante */
    --ombra:0 10px 30px rgba(15,23,42,.18),0 2px 6px rgba(15,23,42,.08);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#dbe4ee;color:var(--testo);
    font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;
    -webkit-font-smoothing:antialiased}
  #map{position:fixed;inset:0;background:#aad3df}
  .leaflet-control-zoom{border:0!important;box-shadow:var(--ombra)!important;border-radius:12px!important;overflow:hidden}
  .leaflet-control-zoom a{background:#fff;color:var(--testo);border-color:var(--bordo);width:38px;height:38px;line-height:38px;font-size:20px}
  .leaflet-control-attribution{background:rgba(255,255,255,.8)!important;color:#475569;font-size:10px;border-radius:6px 0 0 0}

  #pannello{position:fixed;left:0;right:0;bottom:0;z-index:1000;
    background:rgba(255,255,255,.96);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border-radius:20px 20px 0 0;box-shadow:var(--ombra);
    padding:14px 16px calc(64px + env(safe-area-inset-bottom));
    max-height:62vh;overflow:auto}
  #pannello::before{content:"";display:block;width:40px;height:4px;border-radius:2px;background:#cbd5e1;margin:-4px auto 10px}
  @media(min-width:760px){
    #pannello{left:16px;right:auto;bottom:16px;width:400px;border-radius:20px;max-height:calc(100vh - 32px)}
    #pannello::before{display:none}
  }
  h1{font-size:18px;font-weight:700;margin:0 0 10px;letter-spacing:-.01em}
  h1 small{display:block;color:var(--muto);font-size:12.5px;font-weight:500;margin-top:2px}
  .citta{display:grid;grid-template-columns:26px 1fr auto;gap:8px;align-items:center;margin-bottom:8px;position:relative}
  .citta .lettera{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;
    font-size:13px;background:var(--lossodromia);color:#fff;font-weight:700}
  .citta input{width:100%;padding:10px 12px;background:var(--campo);color:var(--testo);
    border:1px solid transparent;border-radius:10px;font:inherit;font-size:15px}
  .citta input::placeholder{color:#94a3b8}
  .citta input:focus{outline:0;border-color:var(--ortodromia);background:#fff;box-shadow:0 0 0 3px rgba(37,99,235,.18)}
  .citta button{padding:10px 14px;background:var(--testo);color:#fff;border:0;
    border-radius:10px;font:inherit;font-size:14px;font-weight:600;cursor:pointer}
  .citta button:hover{background:#1e293b}
  .suggerimenti{grid-column:2/4;background:#fff;border:1px solid var(--bordo);border-radius:10px;
    max-height:180px;overflow:auto;display:none;box-shadow:var(--ombra)}
  .suggerimenti div{padding:9px 12px;cursor:pointer;font-size:13.5px;border-bottom:1px solid var(--bordo)}
  .suggerimenti div:last-child{border-bottom:0}
  .suggerimenti div:hover{background:var(--campo)}
  .nota{font-size:13px;color:var(--muto);margin:4px 0 10px}
  .toggle{display:flex;align-items:center;justify-content:space-between;width:100%;margin:0 0 8px;
    padding:8px 12px;background:var(--campo);border:0;border-radius:10px;font:inherit;font-size:13.5px;
    font-weight:600;color:var(--testo);cursor:pointer}
  .toggle .chev{transition:transform .25s}
  .toggle[aria-expanded="false"] .chev{transform:rotate(180deg)}
  #parametri{overflow:hidden;max-height:600px;transition:max-height .3s ease,opacity .25s}
  #parametri.chiuso{max-height:0;opacity:0}
  .virate{display:flex;align-items:center;gap:12px;margin:2px 0 8px;font-size:14px;font-weight:600}
  .virate .nota{margin:0;font-weight:500}
  .scelte{display:inline-flex;background:var(--campo);border-radius:10px;padding:3px;gap:3px}
  .scelte button{padding:6px 14px;background:transparent;color:var(--muto);border:0;border-radius:8px;
    font:inherit;font-size:14px;font-weight:600;cursor:pointer;font-variant-numeric:tabular-nums}
  .scelte button[aria-pressed="true"]{background:#fff;color:var(--testo);box-shadow:0 1px 3px rgba(15,23,42,.15)}
  .scelte button:focus-visible{outline:2px solid var(--ortodromia);outline-offset:1px}

  table{width:100%;border-collapse:collapse;font-size:14px;margin-top:8px}
  th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--bordo)}
  th{font-weight:600;color:var(--muto);font-size:12px;text-transform:uppercase;letter-spacing:.04em}
  td.num{text-align:right;font-variant-numeric:tabular-nums}
  th.num{text-align:right}
  .leg{display:inline-block;width:20px;height:0;border-top:3px solid;vertical-align:middle;margin-right:8px;border-radius:2px}
  .leg.orto{border-top-style:dashed;border-color:var(--ortodromia)}
  .leg.losso{border-color:var(--lossodromia)}
  .riassunto{margin-top:10px;font-size:14px;line-height:1.7;background:var(--campo);border-radius:12px;padding:10px 12px}
  .riassunto b{font-weight:700;color:var(--ortodromia)}
  .riassunto b.l{color:var(--lossodromia)}

  .etichetta-rotta{background:#fff;color:var(--lossodromia);border:1.5px solid var(--lossodromia);
    border-radius:999px;padding:2px 8px;font:600 12px/1.3 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;
    white-space:nowrap;font-variant-numeric:tabular-nums;position:absolute;left:0;top:0;transform:translate(-50%,-50%);box-shadow:0 2px 6px rgba(15,23,42,.2)}
  .etichetta-orto{background:#fff;color:var(--ortodromia);border:1.5px solid var(--ortodromia);
    border-radius:999px;padding:2px 8px;font:600 12px/1.3 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;
    white-space:nowrap;font-variant-numeric:tabular-nums;position:absolute;left:0;top:0;transform:translate(-50%,-50%);box-shadow:0 2px 6px rgba(15,23,42,.2)}
  .etichetta-angolo{background:var(--testo);color:#fff;border-radius:6px;padding:2px 7px;
    font:600 11.5px/1.3 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;
    white-space:nowrap;font-variant-numeric:tabular-nums;position:absolute;left:0;top:0;transform:translate(-50%,-50%);
    box-shadow:0 2px 6px rgba(15,23,42,.25)}
  .marker-citta{width:16px;height:16px;border-radius:50%;background:var(--lossodromia);
    border:3px solid #fff;box-shadow:0 0 0 2px var(--lossodromia),0 2px 6px rgba(15,23,42,.3)}
</style>
</head>
<body>
<div id="map" role="application" aria-label="Mappamondo Mercatore"></div>

<div id="pannello">
  <h1>Ortodromia e lossodromie <small>proiezione di Mercatore</small></h1>

  <button id="toggle" class="toggle" hidden aria-expanded="true">
    <span id="toggleTesto">Nascondi città</span><span class="chev">▾</span>
  </button>
  <div id="parametri">
  <div class="citta">
    <span class="lettera">A</span>
    <input id="inA" placeholder="Città di partenza" autocomplete="off">
    <button data-cerca="A">Cerca</button>
    <div class="suggerimenti" id="sugA"></div>
  </div>
  <div class="citta">
    <span class="lettera">B</span>
    <input id="inB" placeholder="Città di arrivo" autocomplete="off">
    <button data-cerca="B">Cerca</button>
    <div class="suggerimenti" id="sugB"></div>
  </div>
  <p class="nota" id="nota">Cerca due città oppure tocca la mappa: il primo tocco fissa A, il secondo B, il terzo ricomincia.</p>
  </div>

  <div class="virate">
    <span>Virate</span>
    <div class="scelte" id="virate" role="radiogroup" aria-label="Numero di virate">
      <button data-v="0" aria-pressed="true">0</button>
      <button data-v="1" aria-pressed="false">1</button>
      <button data-v="2" aria-pressed="false">2</button>
      <button data-v="3" aria-pressed="false">3</button>
    </div>
    <span class="nota" id="nSegmenti">1 lossodromia</span>
  </div>

  <div id="risultato" hidden>
    <div class="riassunto" id="riassunto"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
if(typeof L==='undefined') document.write('<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"><\/script>');
</script>
<script>
if(typeof L==='undefined') document.write('<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"><\/script>');
</script>
<script>
(function(){
  if(typeof L==='undefined'){
    document.getElementById('nota').textContent='Impossibile caricare Leaflet: controlla la connessione o eventuali blocchi ai CDN.';
    return;
  }
  const R = 6371.0088;
  const rad = d => d*Math.PI/180, deg = r => r*180/Math.PI;

  // ---- mappa (Web Mercator, EPSG:3857) ----
  const map = L.map('map',{zoomControl:true,minZoom:1,maxZoom:12,worldCopyJump:false})
    .setView([25,12],2);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{
    attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',maxZoom:19}).addTo(map);

  const strato = L.layerGroup().addTo(map);
  const punti = {A:null,B:null}; // {lat,lon,nome}
  let prossimo = 'A';
  let virate = 0; // 0..3 → 1..4 lossodromie

  document.querySelectorAll('#virate button').forEach(b=>b.onclick=()=>{
    virate=Math.min(3,Math.max(0,+b.dataset.v));
    document.querySelectorAll('#virate button').forEach(x=>x.setAttribute('aria-pressed',x===b));
    document.getElementById('nSegmenti').textContent=(virate+1)+(virate===0?' lossodromia':' lossodromie');
    disegna();
  });

  // ---- geometria sferica ----
  function toVec(p){const φ=rad(p.lat),λ=rad(p.lon);return [Math.cos(φ)*Math.cos(λ),Math.cos(φ)*Math.sin(λ),Math.sin(φ)];}
  function toLL(v){return {lat:deg(Math.atan2(v[2],Math.hypot(v[0],v[1]))),lon:deg(Math.atan2(v[1],v[0]))};}
  function ortodromia(a,b,n){ // n+1 punti equispaziati sul cerchio massimo
    const va=toVec(a),vb=toVec(b);
    const ω=Math.acos(Math.max(-1,Math.min(1,va[0]*vb[0]+va[1]*vb[1]+va[2]*vb[2])));
    const out=[];
    for(let i=0;i<=n;i++){
      const f=i/n;
      let p;
      if(ω<1e-9) p=va;
      else{const s=Math.sin(ω),k1=Math.sin((1-f)*ω)/s,k2=Math.sin(f*ω)/s;
        p=[k1*va[0]+k2*vb[0],k1*va[1]+k2*vb[1],k1*va[2]+k2*vb[2]];}
      out.push(toLL(p));
    }
    // srotola le longitudini così la linea non salta all'antimeridiano
    for(let i=1;i<out.length;i++){
      while(out[i].lon-out[i-1].lon>180) out[i].lon-=360;
      while(out[i].lon-out[i-1].lon<-180) out[i].lon+=360;
    }
    return {punti:out,dist:ω*R};
  }
  // lossodromia tra due punti con longitudini già srotolate
  function lossodromia(p1,p2){
    const φ1=rad(p1.lat),φ2=rad(p2.lat),Δφ=φ2-φ1,Δλ=rad(p2.lon-p1.lon);
    const Δψ=Math.log(Math.tan(Math.PI/4+φ2/2)/Math.tan(Math.PI/4+φ1/2));
    const q=Math.abs(Δψ)>1e-12?Δφ/Δψ:Math.cos(φ1);
    const dist=Math.sqrt(Δφ*Δφ+q*q*Δλ*Δλ)*R;
    const rotta=(deg(Math.atan2(Δλ,Δψ))+360)%360;
    return {dist,rotta};
  }
  const fmtKm=k=>k>=1000?Math.round(k).toLocaleString('it-IT')+' km':k.toFixed(1)+' km';
  const fmtNm=k=>Math.round(k/1.852).toLocaleString('it-IT')+' M';
  const fmtRotta=r=>r.toFixed(1).padStart(5,'0')+'°';

  // ---- disegno ----
  function disegna(){
    strato.clearLayers();
    for(const k of ['A','B']){
      const p=punti[k]; if(!p) continue;
      L.marker([p.lat,p.lon],{icon:L.divIcon({className:'marker-citta',iconSize:[14,14]}),title:p.nome})
        .bindTooltip(k+' · '+p.nome,{permanent:false}).addTo(strato);
    }
    const ris=document.getElementById('risultato');
    if(!punti.A||!punti.B){ris.hidden=true;return;}

    const gc=ortodromia(punti.A,punti.B,300);
    L.polyline(gc.punti.map(p=>[p.lat,p.lon]),{color:'#2563eb',weight:3,dashArray:'7 7',opacity:.95}).addTo(strato);
    const A=L.latLng(punti.A.lat,punti.A.lon),B=L.latLng(gc.punti[300].lat,gc.punti[300].lon);
    const corda=L.latLng((A.lat+B.lat)/2,(A.lng+B.lng)/2);
    const m=L.latLng(gc.punti[150].lat,gc.punti[150].lon);
    const no=normaleVerso(gc.punti[149],gc.punti[151],corda);
    etichetta(m,'etichetta-orto',fmtKm(gc.dist),-no.x*22,-no.y*22);

    // virate+1 tratti: waypoint equispaziati lungo la geodetica
    const nSeg=virate+1, passo=300/nSeg;
    const wp=[]; for(let i=0;i<=nSeg;i++) wp.push(gc.punti[Math.round(i*passo)]);
    let totLosso=0;
    for(let i=0;i<nSeg;i++){
      const s=lossodromia(wp[i],wp[i+1]); totLosso+=s.dist;
      // in Mercatore la lossodromia è una retta: due soli vertici
      L.polyline([[wp[i].lat,wp[i].lon],[wp[i+1].lat,wp[i+1].lon]],{color:'#ea580c',weight:4,opacity:1}).addTo(strato);
      if(i>0) L.circleMarker([wp[i].lat,wp[i].lon],{radius:5,color:'#ea580c',fillColor:'#fff',fillOpacity:1,weight:2.5}).addTo(strato);
      const p1=L.latLng(wp[i].lat,wp[i].lon),p2=L.latLng(wp[i+1].lat,wp[i+1].lon);
      const c=map.unproject(map.project(p1,4).add(map.project(p2,4)).divideBy(2),4);
      // verso l'interno (lato corda), lontano dall'ortodromia; con un solo tratto il tratto è la corda: uso l'opposto dell'arco
      let n=normaleVerso(p1,p2,corda);
      if(nSeg===1){const t=normaleVerso(p1,p2,m); n={x:-t.x,y:-t.y};}
      // km al centro del tratto, sul lato esterno (verso l'ortodromia)
      etichetta(c,'etichetta-rotta',fmtKm(s.dist),-n.x*16,-n.y*16);
      // angolo di rotta in partenza e a ogni virata, sul lato interno
      etichetta(p1,'etichetta-angolo',fmtRotta(s.rotta),n.x*30,n.y*30);
    }
    const extra=totLosso-gc.dist;
    const nome=nSeg===1?'Una lossodromia':(['','','Due','Tre','Quattro'][nSeg]+' lossodromie');
    document.getElementById('riassunto').innerHTML=
      `<span class="leg orto"></span>Ortodromia <b>${fmtKm(gc.dist)}</b> (${fmtNm(gc.dist)})<br>`+
      `<span class="leg losso"></span>${nome} <b class="l">${fmtKm(totLosso)}</b> (${fmtNm(totLosso)})<br>`+
      `Differenza: <b class="l">${extra.toFixed(1)} km</b> in più (+${(100*extra/gc.dist).toFixed(2)}%)`;
    ris.hidden=false;
    // ritira la sezione città una volta tracciata la rotta
    document.getElementById('toggle').hidden=false;
    apriParametri(false);
    map.fitBounds(L.latLngBounds(gc.punti.map(p=>[p.lat,p.lon])),{padding:[30,30]});
  }

  function apriParametri(aperto){
    document.getElementById('parametri').classList.toggle('chiuso',!aperto);
    const t=document.getElementById('toggle');
    t.setAttribute('aria-expanded',aperto);
    document.getElementById('toggleTesto').textContent=aperto?'Nascondi città':
      (punti.A&&punti.B?punti.A.nome+' → '+punti.B.nome:'Mostra città');
  }
  document.getElementById('toggle').onclick=()=>apriParametri(
    document.getElementById('toggle').getAttribute('aria-expanded')!=='true');

  // etichetta HTML centrata su un punto, spostata di (dx,dy) pixel
  function etichetta(latlng,cls,testo,dx,dy){
    L.marker(latlng,{icon:L.divIcon({className:'',html:'<div class="'+cls+'">'+testo+'</div>',
      iconSize:[0,0],iconAnchor:[-dx,-dy]}),interactive:false,zIndexOffset:500}).addTo(strato);
  }
  // normale unitaria al segmento p1→p2 (in pixel), orientata verso il punto "verso"
  function normaleVerso(p1,p2,verso){
    const Z=4,a=map.project(p1,Z),b=map.project(p2,Z),v=map.project(verso,Z);
    let nx=-(b.y-a.y),ny=b.x-a.x; const l=Math.hypot(nx,ny)||1; nx/=l; ny/=l;
    const m=a.add(b).divideBy(2);
    if(nx*(v.x-m.x)+ny*(v.y-m.y)<0){nx=-nx;ny=-ny;}
    return {x:nx,y:ny};
  }

  function imposta(k,lat,lon,nome){
    punti[k]={lat,lon,nome};
    document.getElementById('in'+k).value=nome;
    disegna();
  }

  // ---- selezione dalla mappa ----
  map.on('click',e=>{
    let lon=e.latlng.lng; lon=((lon+540)%360)-180;
    const lat=e.latlng.lat;
    if(prossimo==='A'){punti.B=null;document.getElementById('inB').value='';apriParametri(true);}
    imposta(prossimo,lat,lon,lat.toFixed(2)+', '+lon.toFixed(2));
    prossimo=prossimo==='A'?'B':'A';
  });

  // ---- ricerca città (Nominatim) ----
  async function cerca(k){
    const q=document.getElementById('in'+k).value.trim(); if(!q) return;
    const box=document.getElementById('sug'+k);
    box.style.display='block'; box.innerHTML='<div>Ricerca…</div>';
    try{
      const url='https://nominatim.openstreetmap.org/search?format=jsonv2&limit=6&accept-language=it&q='+encodeURIComponent(q);
      const r=await fetch(url,{headers:{'Accept':'application/json'}});
      const dati=await r.json();
      if(!dati.length){box.innerHTML='<div>Nessun risultato. Prova con il nome e il paese.</div>';return;}
      box.innerHTML='';
      dati.forEach(d=>{
        const el=document.createElement('div');
        el.textContent=d.display_name;
        el.onclick=()=>{
          box.style.display='none';
          const nome=d.display_name.split(',')[0];
          imposta(k,+d.lat,+d.lon,nome);
          prossimo=k==='A'?'B':'A';
        };
        box.appendChild(el);
      });
    }catch(err){box.innerHTML='<div>Ricerca non riuscita: controlla la connessione.</div>';}
  }
  document.querySelectorAll('button[data-cerca]').forEach(b=>b.onclick=()=>cerca(b.dataset.cerca));
  ['A','B'].forEach(k=>{
    document.getElementById('in'+k).addEventListener('keydown',e=>{if(e.key==='Enter')cerca(k);});
  });
  document.addEventListener('click',e=>{
    if(!e.target.closest('.citta')) document.querySelectorAll('.suggerimenti').forEach(s=>s.style.display='none');
  });
})();
</script>
</body>
</html>
